<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>跳跳小糬 · Jumping Mochi</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, -apple-system, sans-serif;
    background: linear-gradient(160deg, #e7f5ff 0%, #fff4ec 55%, #ffe9f0 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100%;
    overflow: hidden;
    color: #5b4a4e;
  }
  #app { width: min(520px, 94vw); padding: 10px 0; }
  #title {
    text-align: center;
    font-size: 20px; font-weight: 800; letter-spacing: 2px;
    color: #ff8fab; margin-bottom: 8px; text-shadow: 0 2px 0 #fff;
  }
  #title span { font-size: 22px; }
  #menuBtn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-family: inherit;
    font-size: clamp(12px, 2.2vw, 13px);
    font-weight: 700;
    letter-spacing: .5px;
    cursor: pointer;
    border: none;
    color: #7f5f66;
    background: #ffffffcc;
    padding: 4px 8px 4px 6px;
    border-radius: 999px;
    box-shadow: 0 6px 20px -14px rgba(90,70,80,.45), inset 0 -2px 0 rgba(255,255,255,.9);
    backdrop-filter: blur(6px) saturate(120%);
    transition: transform .15s ease, box-shadow .15s ease, color .15s ease;
    margin-left: clamp(4px, 1.5vw, 8px);
    vertical-align: middle;
    white-space: nowrap;
  }
  #menuBtn:hover { transform: translateY(-1px); color: #e2568a; box-shadow: 0 10px 30px -16px rgba(90,70,80,.5), inset 0 -2px 0 rgba(255,255,255,.95); }
  #menuBtn:active { transform: translateY(1px); }

  /* ---------- recipe drawer (食譜圖鑑) ---------- */
  #drawerMask {
    position: fixed; inset: 0; z-index: 60;
    background: rgba(90, 70, 80, .38); backdrop-filter: blur(3px);
    opacity: 0; visibility: hidden; transition: opacity .25s;
  }
  #drawerMask.open { opacity: 1; visibility: visible; }
  #drawer {
    position: fixed; top: 0; right: 0; height: 100%; z-index: 61;
    width: min(370px, 88vw);
    display: flex; flex-direction: column;
    padding: 16px 14px 12px;
    background: linear-gradient(180deg, #ffffff 0%, #fff6f9 100%);
    box-shadow: -16px 0 40px rgba(140, 90, 110, .28), inset 4px 0 0 #fff0f5;
    transform: translateX(103%);
    transition: transform .32s cubic-bezier(.3, 1.2, .5, 1);
  }
  #drawer.open { transform: translateX(0); }
  .drawer-head { display: flex; align-items: center; gap: 8px; padding: 2px 2px 12px; border-bottom: 2px dashed #ffe0ec; }
  .drawer-title { font-size: 16px; font-weight: 900; letter-spacing: 1px; color: #ff8fab; text-shadow: 0 1px 0 #fff; }
  .drawer-progress { margin-left: auto; font-size: 12px; font-weight: 700; color: #9f7f86; background: #fff0f5; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
  .drawer-progress strong { color: #ff5c8a; }
  #drawerClose {
    border: none; cursor: pointer; font-family: inherit; font-weight: 800; font-size: 14px;
    width: 28px; height: 28px; border-radius: 50%; line-height: 1;
    background: #fff0f5; color: #ff7aa5; box-shadow: 0 3px 0 #ffc6d8;
    transition: transform .1s, box-shadow .1s;
  }
  #drawerClose:active { transform: translateY(2px); box-shadow: 0 1px 0 #ffc6d8; }
  .drawer-hint { font-size: 11px; color: #b9a3aa; padding: 8px 2px 4px; text-align: center; }
  .drawer-foot { padding: 8px 2px 2px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  #resetBtn {
    border: none; cursor: pointer; font-family: inherit; font-weight: 800; font-size: 12px;
    color: #9f7f86; background: #fff; padding: 8px 14px; border-radius: 999px;
    box-shadow: 0 3px 0 #eadfe4, inset 0 0 0 1px #f3eaee;
    transition: transform .1s, box-shadow .1s, color .15s, background .15s;
  }
  #resetBtn:active { transform: translateY(2px); box-shadow: 0 1px 0 #eadfe4, inset 0 0 0 1px #f3eaee; }
  #resetBtn.confirm {
    color: #fff; background: linear-gradient(180deg, #ff9dbb 0%, #ff7aa5 100%);
    box-shadow: 0 3px 0 #e2568a;
  }
  #resetBtn.confirm:active { box-shadow: 0 1px 0 #e2568a; }
  .drawer-list {
    flex: 1; margin-top: 10px; overflow-y: auto;
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;
    padding: 2px 4px 8px 2px;
  }
  .dish {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    background: #fff; border: 2px solid #fff0f6; border-radius: 16px;
    padding: 10px 6px 9px; text-align: center;
    box-shadow: 0 8px 22px -18px rgba(90,70,80,.5), inset 0 -3px 0 #fff6f9;
  }
  .dish .dish-product { font-size: 30px; line-height: 1; filter: drop-shadow(0 4px 6px rgba(200,150,120,.28)); }
  .dish .dish-name { font-size: 12px; font-weight: 800; color: #b07a3c; line-height: 1.25; }
  .dish .dish-items { display: flex; gap: 3px; }
  .dish .dish-items span { font-size: 14px; line-height: 1; }
  .dish.locked { background: #fbfbfd; border-color: #f1eef3; box-shadow: 0 6px 18px -18px rgba(90,70,80,.4); }
  .dish.locked .dish-product { filter: grayscale(1); opacity: .3; }
  .dish.locked .dish-name { color: #cdc6cc; letter-spacing: 2px; }
  .dish.locked .dish-items span { filter: grayscale(1); opacity: .3; }
  .dish.clickable { cursor: pointer; transition: transform .12s, box-shadow .12s, border-color .12s; }
  .dish.clickable:hover {
    transform: translateY(-2px); border-color: #ffd6e5;
    box-shadow: 0 12px 24px -16px rgba(200,110,150,.6), inset 0 -3px 0 #fff6f9;
  }
  .dish.clickable:active { transform: translateY(1px); }
  .dish.shake { animation: dishShake .4s; }
  @keyframes dishShake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-5px); }
    40% { transform: translateX(5px); }
    60% { transform: translateX(-3px); }
    80% { transform: translateX(3px); }
  }
  .dish { position: relative; }
  .dish-new {
    position: absolute; top: 6px; right: 6px;
    font-size: 9px; font-weight: 900; letter-spacing: .5px;
    color: #fff; background: linear-gradient(180deg, #ff9dbb 0%, #ff7aa5 100%);
    padding: 2px 6px; border-radius: 999px; box-shadow: 0 2px 0 #e2568a;
  }
  .dish-new.fadeout { animation: fadeOut .6s forwards; }
  @keyframes fadeOut { from { opacity: 1 } to { opacity: 0 } }

  #stage {
    position: relative;
    width: 100%;
    height: clamp(420px, 78vh, 640px);
    border-radius: 26px;
    overflow: hidden;
    background: linear-gradient(180deg, #d9f0ff 0%, #eaf8ff 45%, #fff7ee 100%);
    box-shadow: 0 18px 40px rgba(190, 150, 165, .30), inset 0 0 0 3px #ffffffcc;
    cursor: pointer;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* ---------- decorations ---------- */
  .cloud { position: absolute; background: #fff; border-radius: 50%; opacity: .85; z-index: 0; }
  .cloud::before, .cloud::after { content: ""; position: absolute; background: #fff; border-radius: 50%; }
  .cloud.c1 { width: 70px; height: 38px; left: 8%; top: 16%; animation: drift 9s ease-in-out infinite; }
  .cloud.c1::before { width: 40px; height: 40px; left: 8px; top: -16px; }
  .cloud.c1::after { width: 30px; height: 30px; right: 8px; top: -12px; }
  .cloud.c2 { width: 54px; height: 30px; right: 10%; top: 30%; animation: drift 11s ease-in-out infinite reverse; }
  .cloud.c2::before { width: 32px; height: 32px; left: 6px; top: -13px; }
  .cloud.c2::after { width: 24px; height: 24px; right: 6px; top: -10px; }
  @keyframes drift { 0%,100% { transform: translateX(0); } 50% { transform: translateX(14px); } }

  #ground {
    position: absolute; left: 0; right: 0; bottom: 0; height: 11%;
    background: linear-gradient(180deg, #c7ee9c 0%, #a9df80 30%, #8fd06b 100%);
    border-top: 4px solid #b8e88f;
    border-radius: 30px 30px 0 0;
    z-index: 1;
  }
  #ground::after {
    content: ""; position: absolute; left: 0; right: 0; top: 12px; height: 3px;
    background: repeating-linear-gradient(90deg, #ffffff55 0 10px, transparent 10px 22px);
    opacity: .5; border-radius: 3px;
  }

  /* ---------- platforms ---------- */
  #platformLayer, #materialLayer { position: absolute; inset: 0; }
  #platformLayer { z-index: 2; }
  #materialLayer { z-index: 3; }
  .platform {
    position: absolute; border-radius: 14px;
    background: linear-gradient(180deg, #ffe1a8 0%, #ffcf7d 45%, #f6b75a 100%);
    box-shadow: 0 6px 0 #e39f45, 0 10px 14px rgba(180, 130, 70, .22);
  }
  .platform.assembly {
    background: linear-gradient(180deg, #ffd3e4 0%, #ffb6d0 50%, #ff96ba 100%);
    box-shadow: 0 6px 0 #ee7aa2, 0 10px 14px rgba(200, 110, 150, .25);
  }
  .platform.assembly::after {
    content: "🎀 組裝台";
    position: absolute; left: 50%; top: -30px; transform: translateX(-50%);
    font-size: 12px; font-weight: 700; white-space: nowrap;
    color: #e2568a; background: #fff0f6; padding: 2px 8px; border-radius: 10px;
    box-shadow: 0 2px 0 #ffc4da;
  }

  .material {
    position: absolute; font-size: clamp(20px, 5vw, 28px); line-height: 1; z-index: 3;
    animation: floaty 2.1s ease-in-out infinite;
    filter: drop-shadow(0 3px 3px rgba(120, 90, 60, .25));
  }
  @keyframes floaty {
    0%, 100% { transform: translate(-50%, 0); }
    50% { transform: translate(-50%, -7px); }
  }
  .material.collected { animation: collectFly .55s cubic-bezier(.3,.7,.4,1) forwards; }
  @keyframes collectFly {
    0% { transform: translate(-50%, 0) scale(1); opacity: 1; }
    100% { transform: translate(-50%, -100px) scale(1.8); opacity: 0; }
  }

  /* ---------- mochi (soft & chewy) ---------- */
  #mochi {
    position: absolute; left: 50%; top: 0;
    transform: translateX(-50%);
    z-index: 5;
    will-change: top;
  }
  #mochiBody, #popupFace {
    position: relative;
    width: 100%; height: 100%;
    border-radius: 50% 50% 47% 47% / 53% 53% 50% 50%;
    background: radial-gradient(circle at 33% 23%, #ffffff 0%, #fff7f8 36%, #ffe8ee 70%, #ffd9e2 100%);
    box-shadow:
      inset -5px -8px 16px rgba(255, 170, 188, .45),
      inset 5px 6px 14px rgba(255, 255, 255, .9),
      0 10px 18px rgba(175, 130, 145, .26);
    transform-origin: 50% 100%;
    will-change: transform;
  }
  #mochiBody::before, #popupFace::before {
    content: "";
    position: absolute; left: 18%; top: 12%;
    width: 32%; height: 24%;
    background: radial-gradient(circle at 42% 40%, #ffffff 0%, rgba(255,255,255,0) 72%);
    border-radius: 50%;
    pointer-events: none;
  }

  /* face features */
  .eye {
    position: absolute; top: 39%;
    width: 11%; height: 11%;
    background: #4a3b40; border-radius: 50%;
  }
  .eye.left { left: 26%; }
  .eye.right { right: 26%; }
  .blush {
    position: absolute; top: 55%;
    width: 18%; height: 10%;
    background: rgba(255, 138, 162, .55);
    border-radius: 50%; opacity: 0; transition: opacity .25s;
  }
  .blush.left { left: 12%; }
  .blush.right { right: 12%; }
  .mouth {
    position: absolute; left: 50%; top: 58%;
    width: 26%; height: 11%;
    transform: translateX(-50%);
    border-bottom: 3.5px solid #4a3b40;
    border-radius: 0 0 60% 60% / 0 0 100% 100%;
  }
  .heart { position: absolute; right: -14%; top: -8%; font-size: 15px; opacity: 0; }

  /* squint eyes (happy ^ ^) shared */
  .f-joy .eye, .f-love .eye, .f-effort .eye, .f-land .eye {
    width: 16%; height: 9%; top: 36%;
    background: transparent;
    border-top: 3.5px solid #4a3b40;
    border-radius: 50% 50% 0 0;
  }
  .f-joy .eye.left, .f-love .eye.left, .f-effort .eye.left, .f-land .eye.left { left: 24%; }
  .f-joy .eye.right, .f-love .eye.right, .f-effort .eye.right, .f-land .eye.right { right: 24%; }

  /* open smile mouth shared */
  .f-joy .mouth, .f-love .mouth, .f-land .mouth {
    width: 30%; height: 17%;
    border-bottom: 0;
    background: #e5677a;
    border-radius: 6px 6px 50% 50% / 6px 6px 100% 100%;
  }

  /* blush states */
  .f-happy .blush, .f-joy .blush, .f-love .blush, .f-land .blush { opacity: 1; }
  .f-love .blush { background: rgba(255, 110, 145, .85); }

  /* love: floating heart */
  .f-love .heart { opacity: 1; animation: heartbeat 1.1s ease-in-out infinite; }
  @keyframes heartbeat {
    0%, 100% { transform: scale(1) translateY(0); }
    50% { transform: scale(1.25) translateY(-3px); }
  }

  /* effort (jumping): small round mouth */
  .f-effort .mouth {
    width: 13%; height: 12%;
    border-bottom: 0;
    background: #e5677a;
    border-radius: 50%;
  }

  /* surprise (falling): wide eyes + small o mouth */
  .f-surprise .eye { width: 16%; height: 16%; top: 33%; }
  .f-surprise .eye.left { left: 23%; }
  .f-surprise .eye.right { right: 23%; }
  .f-surprise .mouth {
    width: 12%; height: 13%;
    border-bottom: 0;
    background: #e5677a;
    border-radius: 50%;
  }

  /* ---------- HUD ---------- */
  #hud {
    position: absolute; left: 0; right: 0; top: 0; z-index: 7;
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; padding: 10px 12px; pointer-events: none;
  }
  #bondBox {
    background: #fff0f5; color: #ff5c8a; font-weight: 800; font-size: 14px;
    padding: 5px 12px; border-radius: 999px; box-shadow: 0 3px 0 #ffc6d8; white-space: nowrap;
  }
  #recipeBox {
    background: #ffffffee; border-radius: 16px; padding: 6px 12px;
    box-shadow: 0 4px 0 #ffe0bf, 0 6px 12px rgba(180,150,120,.18); text-align: right;
  }
  #recipeTop { display: flex; align-items: center; justify-content: flex-end; gap: 6px; }
  #product { font-size: 22px; line-height: 1; }
  #productName { font-size: 12px; font-weight: 700; color: #b07a3c; }
  #needItems { display: flex; gap: 3px; justify-content: flex-end; margin-top: 3px; }
  .need-item { font-size: 15px; line-height: 1; filter: grayscale(1); opacity: .35; transition: all .3s; }
  .need-item.done { filter: none; opacity: 1; transform: scale(1.1); }

  /* ---------- hint ---------- */
  #hint {
    position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%);
    z-index: 6; background: #ffffffdd; color: #8a6b73;
    font-weight: 700; font-size: 14px; padding: 8px 16px; border-radius: 999px;
    box-shadow: 0 4px 10px rgba(150, 120, 130, .2);
    white-space: nowrap; pointer-events: none; transition: opacity .25s;
    animation: hintBob 1.4s ease-in-out infinite;
  }
  @keyframes hintBob {
    0%, 100% { transform: translate(-50%, -50%); }
    50% { transform: translate(-50%, calc(-50% - 5px)); }
  }
  #hint.hidden { opacity: 0; visibility: hidden; }

  /* ---------- popup ---------- */
  #popup {
    position: fixed; inset: 0; z-index: 50;
    display: flex; align-items: center; justify-content: center;
    background: rgba(90, 70, 80, .38); backdrop-filter: blur(3px); transition: opacity .25s;
  }
  #popup.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  .card {
    width: min(340px, 86vw);
    background: linear-gradient(180deg, #ffffff 0%, #fff6f9 100%);
    border-radius: 28px; padding: 26px 22px 22px; text-align: center;
    box-shadow: 0 24px 50px rgba(140, 90, 110, .35), inset 0 0 0 4px #fff0f5;
    animation: popIn .35s cubic-bezier(.2, 1.3, .5, 1);
  }
  @keyframes popIn { 0% { transform: scale(.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .face-wrap { position: relative; width: 76px; height: 76px; margin: 0 auto 12px; }
  .face-pop { animation: facePop .55s cubic-bezier(.2, 1.5, .5, 1); }
  @keyframes facePop {
    0% { transform: scale(1); }
    35% { transform: scale(1.22) rotate(-5deg); }
    60% { transform: scale(.95) rotate(3deg); }
    100% { transform: scale(1) rotate(0); }
  }
  .bubble {
    position: relative; display: inline-block; background: #fff;
    border: 2px solid #ffd6e5; border-radius: 16px; padding: 9px 14px;
    font-size: 15px; font-weight: 700; color: #e2568a;
    margin-bottom: 14px; max-width: 92%; animation: bob 2s ease-in-out infinite;
  }
  .bubble::after {
    content: ""; position: absolute; left: 50%; bottom: -8px; transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 8px solid transparent; border-right: 8px solid transparent;
    border-top: 9px solid #ffd6e5;
  }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  #popupProduct {
    font-size: 72px; line-height: 1;
    transition: transform .5s, opacity .5s;
    filter: drop-shadow(0 8px 10px rgba(200, 150, 120, .35));
    animation: giftPop .5s cubic-bezier(.2, 1.4, .5, 1);
  }
  @keyframes giftPop {
    0% { transform: scale(.5) rotate(-12deg); }
    60% { transform: scale(1.15) rotate(6deg); }
    100% { transform: scale(1) rotate(0); }
  }
  #popupName { font-size: 17px; font-weight: 800; color: #b07a3c; margin: 8px 0 2px; }
  #popupSub { font-size: 12px; color: #b9a3aa; margin-bottom: 16px; }
  #feedBtn {
    width: 100%; border: none; cursor: pointer;
    background: linear-gradient(180deg, #ff9dbb 0%, #ff7aa5 100%);
    color: #fff; font-size: 16px; font-weight: 800; font-family: inherit;
    padding: 13px; border-radius: 16px; box-shadow: 0 5px 0 #e2568a;
    transition: transform .1s, box-shadow .1s, filter .2s;
  }
  #feedBtn:hover:not(:disabled) { filter: brightness(1.05); }
  #feedBtn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 2px 0 #e2568a; }
  #feedBtn:disabled { filter: grayscale(.25) brightness(.98); cursor: default; }
  @keyframes btnPop { 0%{transform:scale(.98)} 40%{transform:scale(1.05)} 70%{transform:scale(.995)} 100%{transform:scale(1)} }
  #feedBtn.pulse, #ddClose.pulse, #menuBtn.pulse, #drawerClose.pulse { animation: btnPop .4s ease-out; }

  /* ---------- dish detail (食譜說明卡) ---------- */
  #dishDetail {
    position: fixed; inset: 0; z-index: 70;
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
    background: rgba(90, 70, 80, .42); backdrop-filter: blur(3px);
    transition: opacity .25s;
  }
  #dishDetail.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  .dd-card {
    position: relative;
    width: min(330px, 88vw); max-height: 84vh; overflow-y: auto;
    background: linear-gradient(180deg, #ffffff 0%, #fff6f9 100%);
    border-radius: 26px; padding: 24px 20px 20px; text-align: center;
    box-shadow: 0 24px 50px rgba(140, 90, 110, .35), inset 0 0 0 4px #fff0f5;
    animation: popIn .32s cubic-bezier(.2, 1.3, .5, 1);
  }
  #ddClose {
    position: absolute; top: 12px; right: 12px;
    border: none; cursor: pointer; font-family: inherit; font-weight: 800; font-size: 14px;
    width: 28px; height: 28px; border-radius: 50%; line-height: 1;
    background: #fff0f5; color: #ff7aa5; box-shadow: 0 3px 0 #ffc6d8;
    transition: transform .1s, box-shadow .1s;
  }
  #ddClose:active { transform: translateY(2px); box-shadow: 0 1px 0 #ffc6d8; }
  .dd-product {
    font-size: 58px; line-height: 1;
    filter: drop-shadow(0 8px 10px rgba(200, 150, 120, .35));
    animation: giftPop .5s cubic-bezier(.2, 1.4, .5, 1);
  }
  .dd-name { font-size: 18px; font-weight: 900; color: #b07a3c; margin: 8px 0 2px; }
  .dd-sub { font-size: 11px; color: #c3aeb5; margin-bottom: 12px; }
  .dd-sec-title { font-size: 12px; font-weight: 800; color: #ff8fab; text-align: left; margin: 12px 2px 6px; }
  .dd-ings { display: flex; flex-direction: column; gap: 6px; }
  .dd-ing {
    display: flex; align-items: center; gap: 9px;
    background: #fff; border: 2px solid #fff0f6; border-radius: 12px; padding: 7px 11px;
  }
  .dd-ing-emoji { font-size: 20px; line-height: 1; }
  .dd-ing-name { font-size: 13px; font-weight: 700; color: #8a6b73; }
  .dd-desc {
    font-size: 13px; line-height: 1.75; color: #8a6b73; text-align: left;
    background: #fff; border: 2px dashed #ffe0ec; border-radius: 14px; padding: 11px 13px;
  }
</style>
</head>
<body>
  <div id="app">
    <div id="title"><span>🍡</span> 跳跳小糬 <span>🍡</span> <button id="menuBtn" type="button" aria-label="開啟食譜圖鑑">📖 食譜圖鑑</button></div>
    <div id="stage">
      <div class="cloud c1"></div>
      <div class="cloud c2"></div>
      <div id="ground"></div>
      <div id="platformLayer"></div>
      <div id="materialLayer"></div>

      <div id="mochi">
        <div id="mochiBody" class="body f-normal">
          <div class="eye left"></div>
          <div class="eye right"></div>
          <div class="blush left"></div>
          <div class="blush right"></div>
          <div class="mouth"></div>
          <div class="heart">💗</div>

      </div>

    buildPlatforms();
    if (recipe) renderMaterials();
    resetMochiToGround();
  }

  function renderMochi() { mochiEl.style.top = Math.round(mochi.y) + 'px'; }

  function resetMochiToGround() {
    mochi.y = groundY - mochi.size;
    mochi.vy = 0;
    mochi.onGround = true;
    mochi.standPlatform = null;
    squish = -0.12;
    squishVel = 0;
    renderMochi();
  }

  function updateHUD() {
    bondVal.textContent = bond;
    productEl.textContent = '❓';
    productNameEl.textContent = '今日餐點？？？';
    needEl.innerHTML = '';
    recipe.items.forEach(function (it) {
      var s = document.createElement('span');
      s.className = 'need-item' + (collected.indexOf(it) >= 0 ? ' done' : '');
      s.textContent = it;
      needEl.appendChild(s);
    });
  }

  function showHint(text, autoHideMs) {
    hintEl.textContent = text;
    hintEl.classList.remove('hidden');
    if (hintTimer) { clearTimeout(hintTimer); hintTimer = 0; }
    if (autoHideMs) hintTimer = setTimeout(hideHint, autoHideMs);
  }
  function hideHint() {
    hintEl.classList.add('hidden');
    if (hintTimer) { clearTimeout(hintTimer); hintTimer = 0; }
  }

  function renderDrawer() {
    drawerList.innerHTML = '';
    var count = 0;
    RECIPES.forEach(function (r, i) {
      var on = !!unlocked[r.name];
      if (on) count++;
      var card = document.createElement('div');
      card.className = 'dish' + (on ? ' clickable' : ' locked');
      card.setAttribute('data-index', i);
      var isNew = on && !newSet[r.name];
      if (isNew) {
        var nb = document.createElement('span');
        nb.className = 'dish-new';
        nb.textContent = 'NEW';
        card.appendChild(nb);
      }
      var prod = document.createElement('div');
      prod.className = 'dish-product';
      prod.textContent = on ? r.product : '❓';
      var nm = document.createElement('div');
      nm.className = 'dish-name';
      nm.textContent = on ? r.name : '？？？';
      var its = document.createElement('div');
      its.className = 'dish-items';
      r.items.forEach(function (it) {
        var s = document.createElement('span');
        s.textContent = on ? it : '?';
        its.appendChild(s);
      });
      card.appendChild(prod);
      card.appendChild(nm);
      card.appendChild(its);
      drawerList.appendChild(card);
    });
    unlockCountEl.textContent = count;
    unlockTotalEl.textContent = RECIPES.length;
  }

  function openDrawer() {
    renderDrawer();
    drawer.classList.add('open');
    drawerMask.classList.add('open');
    drawer.setAttribute('aria-hidden', 'false');
  }

  function closeDrawer() {
    drawer.classList.remove('open');
    drawerMask.classList.remove('open');
    drawer.setAttribute('aria-hidden', 'true');
  }

  function unlockDish(name) {
    if (!name || unlocked[name]) return;
    unlocked[name] = true;
    newSet[name] = true;
    saveUnlocked();
    saveNewSet();
    if (drawer.classList.contains('open')) renderDrawer();
  }

  function flashDrawerHint(msg) {
    if (!drawerHintEl) return;
    drawerHintEl.textContent = msg;
    drawerHintEl.style.color = '#ff7aa5';
    if (drawerHintTimer) clearTimeout(drawerHintTimer);
    drawerHintTimer = setTimeout(function () {
      drawerHintEl.textContent = drawerHintOrig;
      drawerHintEl.style.color = '';
    }, 1700);
  }

  function openDishDetail(r) {
    ddProduct.textContent = r.product;
    ddName.textContent = r.name;
    ddIngs.innerHTML = '';
    r.items.forEach(function (it) {
      var chip = document.createElement('div');
      chip.className = 'dd-ing';
      var em = document.createElement('span');
      em.className = 'dd-ing-emoji';
      em.textContent = it;
      var nm = document.createElement('span');
      nm.className = 'dd-ing-name';
      nm.textContent = INGR[it] || '神秘食材';
      chip.appendChild(em);
      chip.appendChild(nm);
      ddIngs.appendChild(chip);
    });
    ddDesc.textContent = r.desc || '';

    dishDetail.classList.remove('hidden');
    dishDetail.setAttribute('aria-hidden', 'false');
    if (unlocked[r.name] && newSet[r.name]) {
      newSet[r.name] = false;
      saveNewSet();
      renderDrawer();
      return;
    }
    dishDetail.classList.remove('hidden');
    dishDetail.setAttribute('aria-hidden', 'false');
    renderDrawer();
  }

  function closeDishDetail() {
    dishDetail.classList.add('hidden');
    dishDetail.setAttribute('aria-hidden', 'true');
  }

  function onDishCardClick(e) {
    var node = e.target;
    var card = null;
    while (node && node !== drawerList) {
      if (node.classList && node.classList.contains('dish')) { card = node; break; }
      node = node.parentNode;
    }
    if (!card) return;
    var idx = parseInt(card.getAttribute('data-index'), 10);
    var r = RECIPES[idx];
    if (!r) return;
    if (unlocked[r.name]) {
      openDishDetail(r);
    } else {
      card.classList.remove('shake');
      void card.offsetWidth; // 重新觸發動畫
      card.classList.add('shake');
      flashDrawerHint('還沒解鎖哦～先餵小糬吃看看！');
    }
  }

  var resetArmed = false;
  var resetTimer = 0;

  function disarmReset() {
    resetArmed = false;
    resetBtn.classList.remove('confirm');
    resetBtn.textContent = '🗑️ 重置收藏與親密度';
    if (resetTimer) { clearTimeout(resetTimer); resetTimer = 0; }
  }

  function doReset() {
    closeDishDetail();
    try {
      localStorage.removeItem(UNLOCK_KEY);
      localStorage.removeItem(BOND_KEY);
      localStorage.removeItem(NEW_KEY);
    } catch (e) { }
    unlocked = {};
    newSet = {};
    bond = 0;
    bondVal.textContent = bond;
    setFace(baseStateForBond());
    renderDrawer();
  }

  function onResetClick() {
    if (!resetArmed) {
      resetArmed = true;
      resetBtn.classList.add('confirm');
      resetBtn.textContent = '⚠️ 確定要重置？再按一次';
      if (resetTimer) clearTimeout(resetTimer);
      resetTimer = setTimeout(disarmReset, 3500);
      return;
    }
    disarmReset();
    doReset();
  }

  function newRound() {
    recipe = rand(RECIPES);
    collected = [];
    phase = 'playing';
    renderMaterials();
    updateHUD();
    resetMochiToGround();
    setFace(baseStateForBond());
    showHint('點一下，讓我跳起來！');
  }

  function jump() {
    if (phase !== 'playing' || !mochi.onGround) return;
    mochi.vy = -jumpV;
    mochi.onGround = false;
    mochi.standPlatform = null;
    squish = 0.18;
    squishVel = -1.8;
    setFace('effort');
    hideHint();
  }

  function land(p) {
    mochi.onGround = true;
    mochi.standPlatform = p;
    mochi.vy = 0;
    squish = -0.28;
    squishVel = 0;
    tempFace('land', 300);
    if (p) handlePlatformLand(p);
  }

  function handlePlatformLand(p) {
    if (p.assembly) {
      if (collected.length >= recipe.items.length) {
        phase = 'busy';
        setTimeout(showPopup, 300);
      }
      return;
    }
    if (p.item && !p.itemCollected) {
      p.itemCollected = true;
      collected.push(p.item);
      if (p.itemEl) p.itemEl.classList.add('collected');
      updateHUD();
      tempFace('joy', 550);
      if (collected.length >= recipe.items.length) {
        showHint('材料齊了！到最上面組裝 🎀');
      }
    }
  }

  function revealDish() {
    if (phase !== 'revealing') return;
    popupCheer.textContent = '今天我們一起吃「' + recipe.name + '」吧～ ' + rand(CHEERS);
    popupProduct.textContent = recipe.product;
    popupName.textContent = recipe.name;
    popupProduct.style.display = '';
    popupName.style.display = '';
    popupProduct.style.transform = 'scale(.8)';
    popupProduct.style.opacity = '0';
    requestAnimationFrame(function () {
      popupProduct.style.transition = 'transform .4s cubic-bezier(.2,1.4,.5,1), opacity .4s';
      popupProduct.style.transform = 'scale(1)';
      popupProduct.style.opacity = '1';
    });
    feedBtn.disabled = false;
    feedBtn.style.display = '';
    feedBtn.textContent = '餵給小糬 ❤️';
    tempPopupFace('joy', 1100);
    phase = 'popup';
  }

  function showPopup() {
    popup.classList.remove('hidden');
    phase = 'revealing';
    feedBtn.disabled = true;
    feedBtn.style.display = 'none';
    popupProduct.style.display = 'none';
    popupName.style.display = 'none';
    popupProduct.style.transform = '';
    popupProduct.style.opacity = '';
    popupFace.className = 'body f-' + baseStateForBond();
    popupCheer.textContent = '今天我們一起吃「......」？（點一下揭曉）';
    hideHint();
  }

  function feed() {
    if (phase !== 'popup') return;
    bond++;
    bondVal.textContent = bond;
    saveBond();
    tempPopupFace('love', 1400);
    popupCheer.textContent = rand(FEED_REPLIES);
    popupProduct.style.transform = 'scale(1.4)';
    popupProduct.style.opacity = '0.15';
    feedBtn.textContent = '下一道菜 ▶';
    unlockDish(recipe.name);
    phase = 'fed';
  }

  function nextRound() {
    if (phase !== 'fed') return;
    popupProduct.style.transform = '';
    popupProduct.style.opacity = '';
    popup.classList.add('hidden');
    newRound();
  }

  function onFeedBtn() {
    if (phase === 'popup') feed();
    else if (phase === 'fed') nextRound();
  }

  function onPopupClick(e) {
    if (e.target.closest && e.target.closest('#feedBtn')) return;
    if (phase === 'revealing') revealDish();
    else if (phase === 'fed') nextRound();
  }

  function springStep(dt) {
    squishVel += -SPRING_K * squish * dt;
    squishVel *= Math.exp(-SPRING_D * dt);
    squish += squishVel * dt;
  }

  function applySquish() {
    var breathe = 0;
    if (mochi.onGround && Math.abs(squish) < 0.012 && phase === 'playing') {
      breathe = Math.sin(now() / 780) * 0.012;
    }
    var sy = (1 + squish + breathe) * 0.98;
    var sx = (1 - squish * 0.62 - breathe * 0.5) * 1.05;
    sy = Math.max(0.68, Math.min(1.36, sy));
    sx = Math.max(0.68, Math.min(1.36, sx));
    mochiBody.style.transform = 'scale(' + sx.toFixed(3) + ',' + sy.toFixed(3) + ')';
  }

  function update(dt) {
    if (phase !== 'playing') return;
    springStep(dt);

    if (!mochi.onGround) {
      var prevBottom = mochi.y + mochi.size;
      mochi.vy += G * dt;
      mochi.y += mochi.vy * dt;
      var bottom = mochi.y + mochi.size;
      var ceil = -mochi.size * 2;
      if (mochi.y < ceil) { mochi.y = ceil; if (mochi.vy < 0) mochi.vy = 0; }

      if (mochi.vy > 0) {
        if (bottom >= groundY) {
          mochi.y = groundY - mochi.size;
          land(null);
        } else {
          for (var i = 0; i < platforms.length; i++) {
            var p = platforms[i];
            if (prevBottom <= p.top && bottom >= p.top) {
              mochi.y = p.top - mochi.size;
              land(p);
              break;
            }
          }
        }
      }
      renderMochi();
    }

    if (!mochi.onGround) {
      setFace(mochi.vy < 0 ? 'effort' : 'surprise');
    } else if (now() >= tempUntil) {
      setFace(baseStateForBond());
    }

    applySquish();
  }

  function loop(t) {
    if (!lastTime) lastTime = t;
    var dt = (t - lastTime) / 1000;
    lastTime = t;
    if (dt > 0.05) dt = 0.05;
    if (dt < 0) dt = 0;
    update(dt);
    requestAnimationFrame(loop);
  }

  stage.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    jump();
  });
  feedBtn.addEventListener('click', onFeedBtn);
  popup.addEventListener('click', onPopupClick);

  menuBtn.addEventListener('click', openDrawer);
  drawerClose.addEventListener('click', closeDrawer);
  drawerMask.addEventListener('click', closeDrawer);
  resetBtn.addEventListener('click', onResetClick);
  drawerList.addEventListener('click', onDishCardClick);
  ddClose.addEventListener('click', closeDishDetail);
  dishDetail.addEventListener('click', function (e) {
    if (e.target === dishDetail) closeDishDetail();
  });
  ddClose.addEventListener('mousedown', function(){
    ddClose.classList.add('pulse');
    setTimeout(function(){ ddClose.classList.remove('pulse'); }, 400);
  });
  menuBtn.addEventListener('mousedown', function(){
    menuBtn.classList.add('pulse');
    setTimeout(function(){ menuBtn.classList.remove('pulse'); }, 400);
  });
  drawerClose.addEventListener('mousedown', function(){
    drawerClose.classList.add('pulse');
    setTimeout(function(){ drawerClose.classList.remove('pulse'); }, 400);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if (!dishDetail.classList.contains('hidden')) { closeDishDetail(); return; }
      closeDrawer();
    }
  });

  var resizeTimer = 0;
  window.addEventListener('resize', function () {
    if (resizeTimer) clearTimeout(resizeTimer);
    resizeTimer = setTimeout(layout, 120);
  });

  layout();
  setFace(baseStateForBond());
  newRound();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
