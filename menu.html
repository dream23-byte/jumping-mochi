<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>跳跳小糬 · 食譜圖鑑</title>
  <style>
    :root {
      --bg1: #e7f5ff;
      --bg2: #fff4ec;
      --bg3: #ffe9f0;
      --text: #5b4a4e;
      --primary: #ff8fab;
      --primary-dark: #e2568a;
      --card-bg: #ffffffee;
      --gold: #b07a3c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui,
        -apple-system, sans-serif;
      background: linear-gradient(160deg, var(--bg1) 0%, var(--bg2) 55%, var(--bg3) 100%);
      color: var(--text);
      min-height: 100vh;
      padding: clamp(16px, 4vw, 40px) clamp(12px, 3vw, 24px);
      line-height: 1.6;
    }

    header {
      max-width: 1100px;
      margin: 0 auto clamp(20px, 4vw, 40px);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(8px, 2vw, 16px);
    }

    .title {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(8px, 2vw, 14px);
      font-size: clamp(22px, 5vw, 40px);
      font-weight: 900;
      letter-spacing: clamp(2px, 1vw, 6px);
      color: var(--primary);
      text-shadow: 0 3px 0 #fff;
      flex-wrap: wrap;
    }

    .title span.emoji {
      font-size: clamp(26px, 5vw, 44px);
      line-height: 1;
      filter: drop-shadow(0 4px 8px rgba(255, 138, 162, 0.25));
    }

    .subtitle {
      font-size: clamp(13px, 2.2vw, 16px);
      color: #8b6f76;
      max-width: 70ch;
      padding: 0 clamp(4px, 2vw, 8px);
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      color: #7f5f66;
      background: #ffffffcc;
      padding: clamp(6px, 1.5vw, 8px) clamp(10px, 2vw, 14px);
      border-radius: 999px;
      box-shadow: 0 6px 20px -14px rgba(90, 70, 80, 0.45),
        inset 0 -2px 0 rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(6px) saturate(120%);
      transition: transform 0.15s ease, box-shadow 0.15s ease, color 0.15s ease;
      font-size: clamp(12px, 2vw, 14px);
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .back-link:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 30px -16px rgba(90, 70, 80, 0.5),
        inset 0 -2px 0 rgba(255, 255, 255, 0.95);
      color: var(--primary-dark);
    }

    .back-link:active {
      transform: translateY(1px);
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(clamp(240px, 44vw, 280px), 1fr));
      gap: clamp(14px, 3vw, 20px);
    }

    .card {
      position: relative;
      background: var(--card-bg);
      border-radius: clamp(18px, 3vw, 24px);
      padding: clamp(16px, 3vw, 22px) clamp(14px, 3vw, 20px) clamp(14px, 3vw, 18px);
      box-shadow: 0 20px 60px -30px rgba(90, 70, 80, 0.55),
        inset 0 -6px 0 rgba(255, 255, 255, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: clamp(10px, 2vw, 14px);
      transition: transform 0.25s cubic-bezier(0.2, 1.4, 0.5, 1),
        box-shadow 0.25s ease;
      backdrop-filter: blur(8px) saturate(120%);
    }

    .card:hover {
      transform: translateY(-4px) scale(1.01);
      box-shadow: 0 30px 80px -40px rgba(90, 70, 80, 0.6),
        inset 0 -6px 0 rgba(255, 255, 255, 0.95);
    }

    .product {
      width: clamp(84px, 18vw, 108px);
      height: clamp(84px, 18vw, 108px);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(44px, 10vw, 60px);
      line-height: 1;
      background: radial-gradient(
        circle at 50% 30%,
        #fff 0%,
        #fff7f9 60%,
        #ffeaf2 100%
      );
      box-shadow: 0 14px 40px -24px rgba(255, 138, 162, 0.9),
        inset 0 -4px 0 rgba(255, 255, 255, 0.95),
        inset 0 6px 14px rgba(255, 255, 255, 0.9);
      position: relative;
      filter: drop-shadow(0 10px 30px rgba(255, 138, 162, 0.18));
    }

    .product::after {
      content: "";
      position: absolute;
      inset: 6px;
      border-radius: 50%;
      background: radial-gradient(
        circle at 50% 20%,
        rgba(255, 255, 255, 0.55) 0%,
        rgba(255, 255, 255, 0) 70%
      );
      pointer-events: none;
    }

    .name {
      font-size: clamp(15px, 2.6vw, 19px);
      font-weight: 900;
      letter-spacing: 0.5px;
      color: var(--gold);
      text-shadow: 0 1px 0 #fff;
      padding: 0 clamp(4px, 2vw, 6px);
    }

    .items {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(6px, 2vw, 10px);
      flex-wrap: wrap;
      padding: clamp(4px, 1.5vw, 6px) clamp(8px, 2vw, 10px);
      border-radius: 999px;
      background: linear-gradient(180deg, #ffffff 0%, #fff6f9 100%);
      box-shadow: inset 0 -2px 0 rgba(255, 255, 255, 0.95),
        0 10px 40px -24px rgba(90, 70, 80, 0.5);
    }

    .item {
      width: clamp(30px, 6vw, 38px);
      height: clamp(30px, 6vw, 38px);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(18px, 4vw, 22px);
      line-height: 1;
      background: radial-gradient(
        circle at 50% 28%,
        #fff 0%,
        #fffaf2 70%,
        #fff2dc 100%
      );
      box-shadow: 0 8px 30px -20px rgba(176, 122, 60, 0.6),
        inset 0 -2px 0 rgba(255, 255, 255, 0.95);
    }

    .count {
      margin-top: clamp(6px, 2vw, 10px);
      font-size: clamp(11px, 2vw, 13px);
      color: #9f7f86;
      background: #ffffffbb;
      padding: 4px 10px;
      border-radius: 999px;
      box-shadow: inset 0 -1px 0 rgba(255, 255, 255, 0.95),
        0 8px 30px -20px rgba(90, 70, 80, 0.5);
      backdrop-filter: blur(4px);
    }

    footer {
      max-width: 1100px;
      margin: clamp(20px, 4vw, 40px) auto 0;
      text-align: center;
      color: #a08a90;
      font-size: clamp(11px, 2vw, 12px);
    }
  </style>
</head>

<body>
  <header>
    <a class="back-link" href="index.html">← 回到遊戲</a>
    <h1 class="title">
      <span class="emoji">🍡</span>
      跳跳小糬 · 食譜圖鑑
      <span class="emoji">🍡</span>
    </h1>
    <p class="subtitle">
      一起收集、一起組裝、一起享用。這裡列出所有 32 道療癒小餐點，等你每一輪都去發掘～
    </p>
  </header>

  <main>
    <div class="grid" id="grid"></div>
    <div class="count">共 <strong>32</strong> 道餐點</div>
  </main>

  <footer>
    跳跳小糬 · Jumping Mochi｜單檔療癒小遊戲
  </footer>

  <script>

      { items: ["🍵", "🥛", "🍡"], product: "🍵", name: "月光抹茶糬糬拿鐵" },
      { items: ["🍠", "🥛", "🍯"], product: "🍮", name: "暖呼呼地瓜布丁" },
      { items: ["🍑", "🍵", "🍋"], product: "🧋", name: "桃桃晚霞氣泡飲" },
      { items: ["🍌", "🥜", "🍫"], product: "🍨", name: "小糬的睡前香蕉船" },
      { items: ["🍎", "🧀", "🍞"], product: "🥪", name: "森林散步蘋果三明治" },
      { items: ["🍇", "🫐", "🍯"], product: "🧃", name: "星星莓果早餐汁" },
      { items: ["🍊", "🥕", "🍯"], product: "🥕", name: "橘子太陽暖心濃湯" },
      { items: ["🍍", "🥥", "🍚"], product: "🍚", name: "海邊椰香鳳梨飯" },
      { items: ["🍄", "🥔", "🧈"], product: "🍲", name: "森林蘑菇奶油燉鍋" },
      { items: ["🥚", "🧀", "🥐"], product: "🥐", name: "蓬蓬起司蛋可頌" },
      { items: ["🍫", "🍪", "🥛"], product: "🍪", name: "睡衣派對巧克力餅乾" },
      { items: ["🍉", "🍋", "🧊"], product: "🍹", name: "夏日西瓜月亮冰" },
      { items: ["🍅", "🌽", "🧀"], product: "🍕", name: "彩虹小花園披薩" },
      { items: ["🍜", "🥬", "🍄"], product: "🍜", name: "雨天抱抱蔬菜烏龍" },
      { items: ["🍚", "🍳", "🥕"], product: "🍙", name: "小糬元氣彩虹飯糰" },
      { items: ["🥑", "🍞", "🥚"], product: "🥑", name: "綠綠森林酪梨吐司" },
      { items: ["🍒", "🍓", "🍦"], product: "🍨", name: "櫻桃雲朵冰淇淋" },
      { items: ["🥞", "🍌", "🍯"], product: "🥞", name: "早安小熊蜂蜜鬆餅" },
      { items: ["🫘", "🍫", "🥛"], product: "☕", name: "暖手可可豆豆飲" },
      { items: ["🥕", "🥔", "🌽"], product: "🥧", name: "菜園奶奶蔬菜派" },
      { items: ["🍐", "🍇", "🍋"], product: "🍸", name: "微風梨梨葡萄蘇打" },
      { items: ["🥯", "🧀", "🍅"], product: "🥯", name: "番茄起司抱抱貝果" },
      { items: ["🍋", "🍯", "🍵"], product: "🍵", name: "晚安蜂蜜檸檬茶" },
      { items: ["🍓", "🍫", "🥐"], product: "🥐", name: "草莓巧克力迷你可頌" },
      { items: ["🦐", "🥚", "🍚"], product: "🍤", name: "金黃月亮蝦蝦炒飯" },
      { items: ["🥬", "🧀", "🍞"], product: "🥪", name: "綠葉起司脆脆吐司" },
      { items: ["🍈", "🥛", "🍯"], product: "🥤", name: "哈密瓜棉花糖奶昔" },
      { items: ["🍜", "🥚", "🌽"], product: "🍲", name: "星星玉米蛋花湯" },
      { items: ["🍏", "🍎", "🥣"], product: "🥣", name: "雙蘋果脆脆優格碗" },
      { items: ["🥥", "🍌", "🍍"], product: "🍧", name: "椰香小島水果冰" },
      { items: ["🍠", "🍡", "🍵"], product: "🍡", name: "糬糬的地瓜糰子串" },
    ];

    var grid = document.getElementById("grid");
    RECIPES.forEach(function (r) {
      var card = document.createElement("article");
      card.className = "card";
      var product = document.createElement("div");
      product.className = "product";
      product.textContent = r.product;
      var name = document.createElement("h2");
      name.className = "name";
      name.textContent = r.name;
      var items = document.createElement("div");
      items.className = "items";
      r.items.forEach(function (it) {
        var el = document.createElement("div");
        el.className = "item";
        el.textContent = it;
        items.appendChild(el);
      });
      card.appendChild(product);
      card.appendChild(name);
      card.appendChild(items);
      grid.appendChild(card);
    });
  </script>
</body>

</html>
